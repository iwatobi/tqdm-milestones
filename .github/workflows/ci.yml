name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check lockfile
        run: uv lock --check
      - name: Lint
        run: uv run --extra test ruff check .
      - name: Type check
        run: uv run --extra test pyright src tests
      - name: Test with branch coverage
        run: uv run --extra test coverage run -m pytest
      - name: Enforce 100% coverage
        run: uv run --extra test coverage report

  package:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
      - name: Check lockfile
        run: uv lock --check
      - name: Build wheel and source distribution
        run: uv build
      - name: Check package metadata
        run: uv run --extra publish twine check --strict dist/*
      - name: Install the built wheel
        run: |
          uv venv --python 3.14 .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
          .wheel-venv/bin/python -c "from tqdm_milestones import ProgressReporter, tqdm_iter"
      - name: Install the built source distribution
        run: |
          uv venv --python 3.14 .sdist-venv
          uv pip install --python .sdist-venv/bin/python dist/*.tar.gz
          .sdist-venv/bin/python -c "from tqdm_milestones import ProgressReporter, tqdm_iter"
