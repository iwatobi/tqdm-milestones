name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: false
      - name: Check lockfile
        run: uv lock --check
      - name: Lint and type check
        run: |
          uv run --extra test ruff check .
          uv run --extra test pyright src tests
      - name: Test with 100% branch coverage
        run: |
          uv run --extra test coverage run -m pytest
          uv run --extra test coverage report
      - name: Build distributions
        run: uv build
      - name: Check package metadata
        run: uv run --extra publish twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-install:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"
      - name: Install and import from TestPyPI
        run: |
          package_version=$(uv version --short)
          uv venv --python 3.10 --seed .test-venv
          .test-venv/bin/pip install --index-url https://pypi.org/simple/ "tqdm>=4.64"
          for attempt in 1 2 3 4 5 6; do
            if .test-venv/bin/pip install --no-cache-dir --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "tqdm-milestones==$package_version"; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              exit 1
            fi
            sleep 10
          done
          .test-venv/bin/python -c "from tqdm_milestones import ProgressEvent, ProgressReporter, tqdm_iter"
